.carte > * { position:relative; z-index:1; }

/* ---- LE CADRAN : il dit que c'est un chronographe ---- */
.top { display:flex; flex-direction:column; align-items:center; }
.dial { width:44px; height:44px; margin:0 auto 1.15rem; display:block; overflow:visible; }
.d-base { fill:none; stroke:#c6c4be; stroke-width:1; }
.d-ticks line { stroke:#b6b4ae; stroke-width:1; }
.d-prog { fill:none; stroke:#5f5d58; stroke-width:2; stroke-linecap:round; }
.d-heart { fill:#161616; transform-box:fill-box; transform-origin:center; animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.2; transform:scale(0.5); } }

.time {
  font-size:clamp(12.5px,3.6vw,14px);
  letter-spacing:0.16em; text-transform:uppercase; color:#3f3f3d;
  transition: opacity 0.7s ease;
}
.seal {
  margin-top:0.65rem;
  font-size:clamp(8.5px,2.5vw,10px);
  letter-spacing:0.32em; text-transform:uppercase; color:#7c7a75;
  transition: opacity 0.9s ease 0.2s;
}

/* ---- LA PHRASE : tercet qui ondule ---- */
.middle { flex:1; display:flex; align-items:center; justify-content:center; padding:1.6rem 0; }
.phrase {
  font-size:clamp(18px,5vw,21px); font-style:italic;
  line-height:2.1; color:#141414;
  transition: opacity 0.7s ease;
}
.phrase .ln { display:block; animation:vague 8s ease-in-out infinite; }
@keyframes vague { 0%,100% { transform:translateY(-2px); } 50% { transform:translateY(2px); } }

.signature {
  font-size:clamp(8.5px,2.5vw,9.5px);
  letter-spacing:0.24em; text-transform:uppercase; color:#88857f;
  margin-bottom:-0.85rem;
  animation:respire 5s ease-in-out infinite;
}
@keyframes respire { 0%,100% { opacity:0.62; } 50% { opacity:0.95; } }
</style>
</head>
<body>
<div class="carte" id="carte">
  <div class="top">
    <svg class="dial" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="d-base" cx="50" cy="50" r="44"/>
      <g class="d-ticks" id="d-ticks"></g>
      <circle class="d-prog" id="d-prog" cx="50" cy="50" r="44" transform="rotate(-90 50 50)"/>
      <circle class="d-heart" id="d-heart" cx="50" cy="50" r="6"/>
    </svg>
    <div class="time" id="d-time">—</div>
    <div class="seal" id="d-seal">—</div>
  </div>
  <div class="middle"><div class="phrase" id="d-phrase">—</div></div>
  <div class="signature">Éditions LÀ</div>
</div>

<script>
/* ============================================================
   Le Chronographe LÀ — © 2026 Souad Dous / Éditions LÀ
   ============================================================ */
const jours = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];

/* Cylindre A — L'Action (24 heures, calées sur les sept seuils du livre) */
const A = {
  0:"Le fond apparaît", 1:"Les bords s'effacent", 2:"L'ailleurs disparaît",
  3:"Rien ne s'ajoute", 4:"Le présent est entier", 5:"Ce qui est suffit",
  6:"La ligne s'ouvre", 7:"Le bloc se fissure", 8:"L'unité se fragmente",
  9:"Le regard s'expose", 10:"Le proche se dévoile", 11:"L'apparition survient",
  12:"La correction s'efface", 13:"Le mouvement circule", 14:"L'ouverture demeure",
  15:"Le simple déborde", 16:"Rien n'est petit", 17:"L'ordinaire se dépose",
  18:"La mesure s'efface", 19:"La possession s'annule", 20:"La vie traverse",
  21:"La distance s'évanouit", 22:"Le centre se décale", 23:"Rien ne manque"
};
/* Cylindre B — Le Champ (dizaines de minutes) */
const B = ["à même le réel","dans la fêlure","délié du récit","face au vide","par-delà les formes","au plus près"];
/* Cylindre C — L'Ancrage (unités de minutes) */
const C = ["là.","en cet instant.","en transparence.","sans saisie.","tout simplement.","tel quel.","sans retour.","dans le silence.","à l'infini.","et le voir est total."];
/* Cylindre E — La Signature (sceau numérologique de la date) */
const E = {1:"L'UNITÉ",2:"LE MIROIR",3:"LE SOUFFLE",4:"L'ANCRAGE",5:"LE PASSAGE",6:"L'ACCORD",7:"LE SEUIL",8:"L'ÉCLAT",9:"LE TOUT"};

const pad = n => String(n).padStart(2,'0');
const digits = n => String(n).split('').reduce((s,d)=> s + (+d), 0);
function signature(d){
  let t = digits(d.getDate()) + digits(d.getMonth()+1) + digits(d.getFullYear())
        + digits(d.getHours()) + digits(d.getMinutes());
  while(t > 9) t = digits(t);
  return t === 0 ? 9 : t;
}

/* Cadran : graduations */
const ticks = document.getElementById('d-ticks');
for(let i=0;i<12;i++){
  const ang = (i*30) * Math.PI/180;
  const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
  ln.setAttribute('x1', (50 + Math.cos(ang)*40).toFixed(2));
  ln.setAttribute('y1', (50 + Math.sin(ang)*40).toFixed(2));
  ln.setAttribute('x2', (50 + Math.cos(ang)*44).toFixed(2));
  ln.setAttribute('y2', (50 + Math.sin(ang)*44).toFixed(2));
  ticks.appendChild(ln);
}
/* Cadran : l'aiguille qui balaie la minute (le signe du chronographe) */
const prog = document.getElementById('d-prog');
const CIRC = 2 * Math.PI * 44;
prog.style.strokeDasharray = CIRC.toFixed(2);
function sweep(){
  const n = new Date();
  const frac = (n.getSeconds() + n.getMilliseconds()/1000) / 60;
  prog.style.strokeDashoffset = (CIRC * (1 - frac)).toFixed(2);
  requestAnimationFrame(sweep);
}
sweep();

const elTime = document.getElementById('d-time');
const elPhrase = document.getElementById('d-phrase');
const elSeal = document.getElementById('d-seal');
let first = true;

function compose(){
  const n = new Date();
  const h = n.getHours(), m = n.getMinutes(), day = n.getDay();
  return {
    time:  jours[day] + " \u00b7 " + pad(h) + "h" + pad(m),
    lines: [ A[h] + "\u2026", B[Math.floor(m/10)] + "\u2026", C[m % 10] ],
    seal:  E[signature(n)]
  };
}
function apply(d){
  elTime.textContent = d.time;
  elPhrase.innerHTML = d.lines
    .map((l,i)=>'<span class="ln" style="animation-delay:'+(i*1.6).toFixed(1)+'s">'+l+'</span>')
    .join("");
  elSeal.textContent = d.seal;
}
function render(){
  const d = compose();
  if(first){ apply(d); first = false; return; }
  elTime.style.opacity = elPhrase.style.opacity = elSeal.style.opacity = 0;
  setTimeout(() => {
    apply(d);
    elTime.style.opacity = elPhrase.style.opacity = elSeal.style.opacity = 1;
  }, 650);
}
function tick(){
  const now = new Date();
  const ms = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
  setTimeout(() => { render(); tick(); }, ms);
}
if (navigator.standalone) document.body.style.background = "#f1efea";
render();
tick();

/* Mode hors-connexion : garde le Chronographe disponible sans réseau */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
